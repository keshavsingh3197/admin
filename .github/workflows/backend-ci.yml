name: Backend CI

on:
  push:
    branches:
      - master
    # tests/** matters as much as backend/**: without it a change that only touches the test
    # project runs no workflow at all, and neither does a change to the CI file itself.
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Restore of the private KeshavSingh.* packages reads this via the repo-root
    # nuget.config. The built-in GITHUB_TOKEN failed with 403 on the private
    # user-scoped package feeds in run 30369444769, so prefer the repository
    # PAT secret and only fall back to github.token if that secret is
    # intentionally not configured.
    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Admin.Api.csproj

      - name: Build
        run: dotnet build backend/Admin.Api.csproj --no-restore --configuration Release

      # The reason this job exists. Building alone never caught a behavioural regression, and the
      # test project sits outside backend/, so it needs its own restore/build.
      - name: Test
        run: dotnet test tests/Admin.Api.Tests/Admin.Api.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish backend/Admin.Api.csproj --no-build --configuration Release --output ./out
