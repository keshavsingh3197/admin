name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # GITHUB_TOKEN gets exactly the scopes listed here and nothing more. Without this, npm's read of the
  # private @keshavsingh3197/* packages is refused even though the token is wired into the install step.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # The private @keshavsingh3197/* packages come from GitHub Packages. The committed .npmrc
      # references ${PACKAGES_READ_TOKEN}; without it npm sends an empty credential and the registry
      # answers 401 for every scoped package. GITHUB_TOKEN works here because this repo and the
      # package repo share an owner.
      - name: Install dependencies
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --configuration production --base-href /

      # SPA fallback: GitHub Pages serves 404.html for unknown paths. Copying index.html there
      # lets client-side routes (e.g. /login, deep links) load the app instead of a 404.
      # (This step inherits working-directory: frontend, so the path is relative to frontend/.)
      - name: Add SPA 404 fallback
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
