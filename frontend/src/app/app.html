<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/">🛡️ Admin</a>

    @if (auth.isAuthenticated()) {
      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
        <a routerLink="/notes" routerLinkActive="active">Notes</a>
        <a routerLink="/security" routerLinkActive="active">Security</a>
        @if (auth.hasRole('Admin')) {
          <a routerLink="/users" routerLinkActive="active">Users</a>
          <a routerLink="/analytics" routerLinkActive="active">Analytics</a>
          <a routerLink="/settings" routerLinkActive="active">Settings</a>
        }
      </nav>
      <div class="spacer"></div>
      <div class="user-chip">
        <button class="theme-btn" type="button" (click)="toggleTheme()" [attr.aria-label]="'Switch theme, current: ' + theme()" [title]="'Theme: ' + theme()">
          <span aria-hidden="true">{{ theme() === 'light' ? '☀' : (theme() === 'dark' ? '☾' : '✦') }}</span>
        </button>
        <span class="user-name">{{ auth.user()?.displayName }}</span>
        <button class="logout-btn" type="button" (click)="logout()">Sign out</button>
      </div>
    }
  </header>

  @if (routeLoading()) {
    <div class="route-loader" role="status" aria-live="polite" aria-label="Loading page">
      <div class="route-loader-card">
        <div class="logo-pulse" aria-hidden="true">KS</div>
        <p>Loading your admin workspace...</p>
      </div>
    </div>
  }

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <small>admin.keshavsingh.in</small>
  </footer>
</div>
