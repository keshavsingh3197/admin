<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin | keshavsingh.in</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0f1724;
      color: #e8eef9;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      z-index: 9999;
      transition: opacity 180ms ease;
    }

    #boot-loader.hidden { opacity: 0; pointer-events: none; }

    #boot-loader .brand {
      display: grid;
      place-items: center;
      gap: 0.55rem;
      text-align: center;
    }

    #boot-loader .badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(75, 151, 255, 0.45);
      display: grid;
      place-items: center;
      color: #7cb3ff;
      font-weight: 800;
      letter-spacing: .04em;
      animation: boot-pulse .8s ease-in-out infinite alternate;
    }

    #boot-loader .hint { font-size: 0.9rem; opacity: 0.9; }

    @keyframes boot-pulse {
      from { transform: scale(1); box-shadow: 0 0 0 0 rgba(75, 151, 255, 0.3); }
      to { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(75, 151, 255, 0); }
    }
  </style>
</head>
<body>
  <div id="boot-loader" role="status" aria-live="polite">
    <div class="brand">
      <div class="badge">KS</div>
      <div>Admin</div>
      <div class="hint">Preparing secure workspace...</div>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
