services:
  - type: web
    name: admin-api
    # This service builds from backend/Dockerfile (a Docker web service on Render).
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDbSettings__ConnectionString
        sync: false
      - key: MongoDbSettings__DatabaseName
        value: AdminDb
      - key: AllowedOrigins__0
        value: https://admin.keshavsingh.in
      - key: AllowedOrigins__1
        value: https://keshavsingh3197.github.io
      # ---- Auth secrets (runtime) — set values in the Render dashboard, never in git ----
      - key: Jwt__SigningKey        # >= 32 chars
        sync: false
      - key: Encryption__DataKey    # base64 of 32 random bytes
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
    healthCheckPath: /health
    # NOTE: PACKAGES_READ_TOKEN is a *build* secret, not a runtime env var. Docker builds
    # can't read env vars, so add it in the Render dashboard as a SECRET FILE named
    # PACKAGES_READ_TOKEN (contents = a read:packages classic PAT). The Dockerfile mounts it.
