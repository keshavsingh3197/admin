services:
  - type: web
    name: admin-api
    runtime: dotnet
    buildCommand: dotnet publish backend/Admin.Api.csproj -c Release -o out
    startCommand: dotnet out/Admin.Api.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDbSettings__ConnectionString
        sync: false
      - key: MongoDbSettings__DatabaseName
        value: AdminDb
      - key: AllowedOrigins__0
        value: https://admin.keshavsingh.in
      - key: AllowedOrigins__1
        value: https://keshavsingh3197.github.io
      # Needed at build time to restore the private KeshavSingh.* packages (read:packages
      # PAT). Set its value in the Render dashboard — sync:false keeps it out of git.
      - key: PACKAGES_READ_TOKEN
        sync: false
      # Auth secrets — set values in the Render dashboard, never in git.
      - key: Jwt__SigningKey
        sync: false
      - key: Encryption__DataKey
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
    healthCheckPath: /health
