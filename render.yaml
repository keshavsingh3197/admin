services:
  - type: web
    name: admin-api
    branch: master
    autoDeploy: true
    # This service builds from backend/Dockerfile (a Docker web service on Render).
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDbSettings__ConnectionString
        sync: false
      - key: MongoDbSettings__DatabaseName
        value: AdminDb
      # The credentialed CORS allowlist. These origins also carry the .keshavsingh.in SSO cookie,
      # so each one is a fully trusted origin — add a site here only when it should be able to
      # trade the cookie for an access token. Indexes must be contiguous from 0 or the binder
      # stops early, and setting any of them REPLACES the whole appsettings array.
      - key: AllowedOrigins__0
        value: https://admin.keshavsingh.in
      - key: AllowedOrigins__1
        value: https://keshavsingh3197.github.io
      - key: AllowedOrigins__2
        value: https://git.keshavsingh.in
      - key: AllowedOrigins__3
        value: https://blog.keshavsingh.in
      - key: AllowedOrigins__4
        value: https://keshavsingh.in
      # ---- Auth secrets (runtime) — set values in the Render dashboard, never in git ----
      - key: Jwt__SigningKey        # >= 32 chars
        sync: false
      - key: Encryption__DataKey    # base64 of 32 random bytes
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
    healthCheckPath: /health
    # NOTE: PACKAGES_READ_TOKEN is a *build* secret, not a runtime env var. Docker builds
    # can't read env vars, so add it in the Render dashboard as a SECRET FILE named
    # PACKAGES_READ_TOKEN (contents = a read:packages classic PAT). The Dockerfile mounts it.
